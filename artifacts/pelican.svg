<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕 · 潮间静立</title>
  <desc id="desc">手绘矢量插画：一只白鹈鹕站在海边礁石上，侧向右方，具有细长的金橙色鸟喙、宽大的喉囊、弯曲的长颈、层叠的象牙白羽毛、黑色飞羽和橙色蹼足。背景为浅青色海湾与淡金色日轮。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d9e9e4"/><stop offset="1" stop-color="#edf0df"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fffdf1"/><stop offset=".56" stop-color="#f5f0dd"/><stop offset="1" stop-color="#bacbc4"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#fffdf1"/><stop offset=".65" stop-color="#e9e7d5"/><stop offset="1" stop-color="#a7bab4"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7cf7e"/><stop offset=".55" stop-color="#e7a154"/><stop offset="1" stop-color="#c77842"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffdf86"/><stop offset="1" stop-color="#eeaa4e"/>
    </linearGradient>
    <clipPath id="scene"><circle cx="598" cy="458" r="367"/></clipPath>
  </defs>

